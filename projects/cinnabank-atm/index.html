<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CinnaBank ATM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-dark: #23262b;
    --steel: #33383f;
    --steel-light: #565f68;
    --steel-edge: #6b7580;
    --steel-highlight: #7d8892;
    --phosphor: #3dffa0;
    --phosphor-dim: #1c7a56;
    --amber: #ffb648;
    --red-led: #ff3b3b;
    --paper: #e9e4d6;

    /* Everything below is driven off vmin so the WHOLE machine — and the
       whole screen — is always guaranteed to fit inside the viewport,
       on any aspect ratio (phone portrait, ultrawide desktop, etc). */
    --unit: 1vmin;
    --shell-h: 92vmin;
    --shell-aspect: 0.6; /* width / height */
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 30%, #14161a 0%, #050607 70%);
    overflow:hidden;
    font-family:'JetBrains Mono', monospace;
  }
  #stage{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    perspective: 1600px;
  }

  /* ---------- floor glow / ambient ---------- */
  #stage::before{
    content:"";
    position:absolute; left:50%; bottom:2%;
    width:60vmin; height:14vmin; transform:translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(61,255,160,.10) 0%, rgba(61,255,160,0) 70%);
    pointer-events:none;
  }

  /* ================= ATM SHELL (the physical machine) ================= */
  #atm-shell{
    position:relative;
    height: var(--shell-h);
    aspect-ratio: var(--shell-aspect);
    max-width: 94vw;
    max-height: 94vh;
    transform-style: preserve-3d;
    transform: rotateX(var(--tiltX,0deg)) rotateY(var(--tiltY,0deg));
    transition: transform .25s cubic-bezier(.2,.7,.3,1);
    will-change: transform;
    display:flex; flex-direction:column;
  }

  .plate{
    background: linear-gradient(160deg, var(--steel-light) 0%, var(--steel) 45%, var(--steel-dark) 100%);
    border-radius: calc(var(--unit)*1.4);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.05),
      inset 0 2px 6px rgba(255,255,255,.08),
      inset 0 -6px 14px rgba(0,0,0,.5),
      0 2vmin 4vmin rgba(0,0,0,.55);
  }

  #panel{
    flex: 1 1 auto;
    display:flex; flex-direction:column;
    padding: 2.4% 5%;
    box-sizing:border-box;
    min-height:0;
    position:relative;
  }
  #panel::after{ /* brushed metal texture */
    content:"";
    position:absolute; inset:0; border-radius:inherit;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    mix-blend-mode:overlay;
  }

  #brand-plaque{
    font-family:'Oswald',sans-serif; letter-spacing:.14em; color:#d7dde2;
    font-size: calc(var(--unit)*2);
    text-shadow:0 0 1.2vmin rgba(255,182,72,.35);
    text-align:center;
    margin-bottom: 1vmin;
    flex: 0 0 auto;
  }
  #status-led-strip{
    position:absolute; top: 6.5%; left:50%; transform:translateX(-50%);
    width:34%; height:.55vmin; border-radius:2px;
    background: var(--amber);
    box-shadow: 0 0 1.2vmin var(--amber);
    animation: ledpulse 3s ease-in-out infinite;
  }
  @keyframes ledpulse{ 0%,100%{opacity:.55} 50%{opacity:1} }

  /* ---------- screen bezel + CRT ---------- */
  #screen-bezel{
    flex: 0 0 46%;
    background: linear-gradient(155deg, var(--steel-dark), #101215 70%);
    border-radius: calc(var(--unit)*1.1);
    padding: 2.4%;
    box-sizing:border-box;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      inset 0 3px 10px rgba(0,0,0,.6),
      0 .6vmin 1.4vmin rgba(0,0,0,.5);
    transform: translateZ(1.4vmin);
  }
  #screen{
    position:relative;
    width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 40%, #06170f 0%, #010603 100%);
    border-radius: calc(var(--unit)*0.6);
    box-shadow: inset 0 0 4vmin rgba(0,0,0,.9), 0 0 2.4vmin rgba(61,255,160,.15);
    overflow:hidden;
    color: var(--phosphor);
    font-size: clamp(11px, 2.1vmin, 22px);
    cursor:pointer;
  }
  #screen::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
    mix-blend-mode:multiply;
    pointer-events:none;
    animation: flicker 6s infinite;
  }
  @keyframes flicker{ 0%,100%{opacity:.55} 50%{opacity:.4} 52%{opacity:.6} }

  .crt-page{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding: 3.5% 5%;
    box-sizing:border-box;
    text-shadow: 0 0 6px rgba(61,255,160,.65);
  }
  .crt-page.active{ display:flex; }
  .crt-title{
    font-size:.9em; letter-spacing:.1em; text-transform:uppercase;
    border-bottom:1px solid var(--phosphor-dim);
    padding-bottom:.4em; margin-bottom:.6em; opacity:.9;
    flex: 0 0 auto;
  }
  .crt-line{ font-size:.85em; line-height:1.55; }
  .crt-sub{ color:var(--phosphor-dim); font-size:.75em; }
  .crt-input{
    background:transparent; border:none; border-bottom:1px solid var(--phosphor-dim);
    color:var(--phosphor); font-family:inherit; font-size:.85em; padding:.45em .1em;
    outline:none; width:100%; margin:.3em 0 .7em 0; text-shadow: 0 0 5px rgba(61,255,160,.6);
  }
  .crt-input::placeholder{ color: var(--phosphor-dim); opacity:.8; }
  .crt-btn{
    background:transparent; border:1px solid var(--phosphor-dim); color:var(--phosphor);
    font-family:inherit; font-size:.78em; letter-spacing:.05em; text-transform:uppercase;
    padding:.55em .8em; margin:.25em .3em .25em 0; cursor:pointer; text-shadow: 0 0 5px rgba(61,255,160,.5);
    transition: background .15s, color .15s;
  }
  .crt-btn:hover{ background:var(--phosphor); color:#04150c; }
  .crt-btn:disabled{ opacity:.35; cursor:default; }
  .crt-btn:disabled:hover{ background:transparent; color:var(--phosphor); }
  .crt-row{ display:flex; flex-wrap:wrap; gap:.15em; margin-top:auto; flex: 0 0 auto; }
  .crt-error{ color:var(--red-led); font-size:.72em; margin-top:.3em; min-height:1.4em; text-shadow:0 0 6px rgba(255,59,59,.6); }
  .crt-balance{ font-size:1.6em; margin:.2em 0 .5em 0; }
  .crt-flex-fill{ flex:1 1 auto; min-height:0; overflow-y:auto; }
  .blink{ animation: blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* thin scrollbar so it fits the retro vibe instead of a fat native one */
  .crt-flex-fill::-webkit-scrollbar{ width:5px; }
  .crt-flex-fill::-webkit-scrollbar-thumb{ background: var(--phosphor-dim); border-radius:3px; }

  /* ---------- keypad (decorative) ---------- */
  #keypad{
    flex: 0 0 15%;
    margin-top: 2.4%;
    display:grid;
    grid-template-columns: repeat(3,1fr);
    grid-template-rows: repeat(4,1fr);
    gap: 3% 4%;
    transform: translateZ(.8vmin);
  }
  .key{
    background: linear-gradient(160deg, var(--steel-edge), var(--steel));
    border-radius: .4vmin;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 0 -2px 3px rgba(0,0,0,.35),
      0 .3vmin .3vmin rgba(0,0,0,.4);
  }

  /* ---------- I/O row: card + receipt + dispenser ---------- */
  #io-row{
    flex: 0 0 auto;
    margin-top: 3%;
    display:flex;
    flex-direction:column;
    gap: 3%;
  }
  .io-unit{ position:relative; }
  .io-label{
    position:absolute; left:0; top:100%;
    font-size: calc(var(--unit)*.85);
    color:#8a94a0; letter-spacing:.1em; margin-top:.3vmin;
  }

  #card-slot-mouth{
    height: 2.2vmin; border-radius: 1.1vmin;
    background: linear-gradient(to bottom, #0a0c0e, #1c1f23 40%, #2a2e33);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.06);
  }
  #card-led{
    position:absolute; right: 6%; top:50%; transform:translateY(-50%);
    width: 1.1vmin; height:1.1vmin; border-radius:50%;
    background: var(--red-led);
    box-shadow: 0 0 1.4vmin var(--red-led);
    transition: background .3s, box-shadow .3s;
  }
  #card-led.led-green{ background: var(--phosphor); box-shadow:0 0 1.4vmin var(--phosphor); }
  #card-led.led-amber{ background: var(--amber); box-shadow:0 0 1.4vmin var(--amber); }

  #receipt-slot-mouth{
    height: 1.5vmin; border-radius: .6vmin;
    background: linear-gradient(to bottom, #0a0c0e, #1c1f23 50%, #2a2e33);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.8);
    overflow:visible;
    position:relative;
  }
  #receipt-paper{
    position:absolute; left:8%; top:0; width:84%; height:.6vmin;
    background: var(--paper);
    border-radius: 0 0 .3vmin .3vmin;
    box-shadow: 0 .4vmin .6vmin rgba(0,0,0,.4);
    transform-origin: top center;
    transform: scaleY(0);
    opacity:0;
    transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .2s;
    font-size: calc(var(--unit)*.7);
    color:#2a2a2a;
    white-space:pre-line;
    padding: 6% 8% 3%;
    box-sizing:border-box;
    overflow:hidden;
    z-index:2;
  }
  #receipt-paper.printed{ height:auto; min-height:22vmin; transform:scaleY(1); opacity:1; }

  /* ---------- cash dispenser ---------- */
  #dispenser-unit{ height: 8vmin; }
  #dispenser-housing{
    position:relative;
    height:100%;
    border-radius: .8vmin;
    background: linear-gradient(160deg, var(--steel-dark), #16181b);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.6);
    overflow:visible;
  }
  #dispenser-flap{
    position:absolute; left:6%; right:6%; top:0; height:60%;
    background: linear-gradient(160deg, var(--steel-edge), var(--steel));
    border-radius: .5vmin .5vmin 0 0;
    transform-origin: top center;
    transform: rotateX(0deg);
    box-shadow: 0 .4vmin .8vmin rgba(0,0,0,.4);
    transition: transform .45s ease;
    z-index:3;
  }
  #dispenser-flap.open{ transform: rotateX(-115deg); }
  #bills-tray{
    position:absolute; left:0; right:0; bottom:-2vmin; height:8vmin;
    pointer-events:none;
    z-index:2;
  }
  .bill{
    position:absolute; left:50%; top:0;
    width: 11vmin; height: 5vmin;
    margin-left:-5.5vmin;
    border-radius: .4vmin;
    background: linear-gradient(135deg, #3fa06a, #2f8f5a 60%, #276f47);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 .3vmin .6vmin rgba(0,0,0,.4);
    opacity:0;
    transform: translate(0,-2vmin) rotate(0deg);
    transition: transform .65s cubic-bezier(.3,.6,.3,1), opacity .3s;
  }

  #plinth{
    flex: 0 0 5.5%;
    margin-top: 1.6%;
    background: linear-gradient(160deg, var(--steel-dark), #0c0d0f);
    border-radius: calc(var(--unit)*1);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.05), 0 1vmin 2vmin rgba(0,0,0,.6);
    transform: translateZ(-.6vmin);
  }

  #hint{
    position:absolute; bottom:2.4%; left:50%; transform:translateX(-50%);
    color:#8a94a0; font-size:.75rem; letter-spacing:.04em;
    pointer-events:none; user-select:none;
  }

  @media (prefers-reduced-motion: reduce){
    #atm-shell{ transition:none; }
    .bill, #dispenser-flap, #receipt-paper{ transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="atm-shell">
    <div id="panel" class="plate">
      <div id="brand-plaque">CINNABANK</div>
      <div id="status-led-strip"></div>

      <div id="screen-bezel">
        <div id="screen">

          <!-- IDLE -->
          <div class="crt-page active" data-page="idle">
            <div class="crt-flex-fill" style="justify-content:center; align-items:center; display:flex; flex-direction:column;">
              <div class="crt-line" style="font-size:1.1em;">WELCOME</div>
              <div class="crt-sub" style="margin-top:.6em;">tap screen to begin<span class="blink">_</span></div>
            </div>
          </div>

          <!-- AUTH -->
          <div class="crt-page" data-page="auth">
            <div class="crt-title">Account Access</div>
            <div class="crt-flex-fill">
              <input class="crt-input" id="auth-name" placeholder="full name (signup only)">
              <input class="crt-input" id="auth-email" placeholder="email" type="email">
              <input class="crt-input" id="auth-pass" placeholder="password" type="password">
              <div class="crt-error" id="auth-error"></div>
            </div>
            <div class="crt-row">
              <button class="crt-btn" id="btn-login">Login</button>
              <button class="crt-btn" id="btn-signup">New Account</button>
              <button class="crt-btn" id="btn-idle-back">Cancel</button>
            </div>
          </div>

          <!-- MENU -->
          <div class="crt-page" data-page="menu">
            <div class="crt-title">Card Accepted — <span id="menu-name"></span></div>
            <div class="crt-flex-fill">
              <div class="crt-sub">Acct No. <span id="menu-account"></span> · Card <span id="menu-card"></span></div>
              <div class="crt-sub" style="margin-top:.6em;">Balance</div>
              <div class="crt-balance" id="menu-balance">₱0.00</div>
            </div>
            <div class="crt-row">
              <button class="crt-btn" data-page-to="withdraw">Withdraw</button>
              <button class="crt-btn" data-page-to="loan">Loans</button>
              <button class="crt-btn" id="btn-logout">Eject Card</button>
            </div>
          </div>

          <!-- WITHDRAW -->
          <div class="crt-page" data-page="withdraw">
            <div class="crt-title">Withdraw Cash</div>
            <div class="crt-flex-fill">
              <div class="crt-sub">Available: <span id="wd-balance"></span></div>
              <div class="crt-sub" style="margin-top:.7em;">Select amount</div>
              <div class="crt-row" style="margin-top:.3em;">
                <button class="crt-btn wd-amt-btn" data-amt="200">₱200</button>
                <button class="crt-btn wd-amt-btn" data-amt="500">₱500</button>
                <button class="crt-btn wd-amt-btn" data-amt="1000">₱1,000</button>
                <button class="crt-btn wd-amt-btn" data-amt="2000">₱2,000</button>
                <button class="crt-btn wd-amt-btn" data-amt="5000">₱5,000</button>
              </div>
              <input class="crt-input" id="wd-amount" placeholder="or type custom amount (₱)" type="number" min="1" style="margin-top:.8em;">
              <div class="crt-error" id="wd-error"></div>
            </div>
            <div class="crt-row">
              <button class="crt-btn" id="btn-wd-confirm">Confirm</button>
              <button class="crt-btn" data-page-to="menu">Back</button>
            </div>
          </div>

          <!-- LOAN -->
          <div class="crt-page" data-page="loan">
            <div class="crt-title">Loan Services</div>
            <div class="crt-flex-fill">
              <div class="crt-sub">30% interest · 10 min deadline</div>
              <input class="crt-input" id="loan-amount" placeholder="amount (₱500–50,000)" type="number" min="500" max="50000">
              <div class="crt-error" id="loan-error"></div>
            </div>
            <div class="crt-row">
              <button class="crt-btn" id="btn-loan-take">Take Loan</button>
              <button class="crt-btn" id="btn-loan-pay">Repay</button>
              <button class="crt-btn" data-page-to="menu">Back</button>
            </div>
          </div>

          <!-- RECEIPT -->
          <div class="crt-page" data-page="receipt">
            <div class="crt-title">Transaction Complete</div>
            <div class="crt-flex-fill">
              <div class="crt-line" id="receipt-text" style="white-space:pre-line;"></div>
            </div>
            <div class="crt-row">
              <button class="crt-btn" data-page-to="menu">Done</button>
            </div>
          </div>

          <!-- BUSY -->
          <div class="crt-page" data-page="busy">
            <div class="crt-flex-fill" style="justify-content:center; align-items:center; display:flex;">
              <div class="crt-line">processing<span class="blink">...</span></div>
            </div>
          </div>

        </div>
      </div>

      <div id="keypad"></div>

      <div id="io-row">
        <div class="io-unit" id="card-reader">
          <div id="card-slot-mouth"></div>
          <div id="card-led"></div>
          <div class="io-label">CARD</div>
        </div>
        <div class="io-unit" id="receipt-unit">
          <div id="receipt-slot-mouth">
            <div id="receipt-paper"></div>
          </div>
          <div class="io-label">RECEIPT</div>
        </div>
        <div class="io-unit" id="dispenser-unit">
          <div id="dispenser-housing">
            <div id="dispenser-flap"></div>
            <div id="bills-tray"></div>
          </div>
          <div class="io-label">CASH</div>
        </div>
      </div>
    </div>

    <div id="plinth"></div>
  </div>

  <div id="hint">drag to look around</div>
</div>

<script type="module">
import { CinnaBank } from './cinnabank-sdk.js';

/* ============ CONFIG ============ */
// Receiver UID for the "withdrawal tax" gag — the ATM's cash-dispenser fee sink.
const CASHOUT_UID = "iBEn6h3QCDRBTZdUhR8LxPWl1vM2";

const cinnabank = new CinnaBank();

/* ============ SCREEN PAGE ROUTER ============ */
const pages = document.querySelectorAll('.crt-page');
function showPage(name){
  pages.forEach(p => p.classList.toggle('active', p.dataset.page === name));
}
document.querySelectorAll('[data-page-to]').forEach(btn=>{
  btn.addEventListener('click', ()=> showPage(btn.dataset.pageTo));
});

document.getElementById('screen').addEventListener('click', (e)=>{
  const idlePage = document.querySelector('[data-page="idle"]');
  if(idlePage.classList.contains('active')){
    playCardInsertAnim();
    showPage('auth');
  }
});
document.getElementById('btn-idle-back').addEventListener('click', ()=>{
  playCardEjectAnim();
  showPage('idle');
});

/* ============ AUTH ============ */
document.getElementById('btn-login').addEventListener('click', async ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const err = document.getElementById('auth-error');
  err.textContent = '';
  showPage('busy');
  try{
    await cinnabank.login(email, pass);
  }catch(e){
    err.textContent = e.message;
    showPage('auth');
  }
});

document.getElementById('btn-signup').addEventListener('click', async ()=>{
  const name = document.getElementById('auth-name').value.trim();
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const err = document.getElementById('auth-error');
  err.textContent = '';
  showPage('busy');
  try{
    await cinnabank.signup(name, email, pass);
  }catch(e){
    err.textContent = e.message;
    showPage('auth');
  }
});

cinnabank.onAuthStateChanged((user, userData)=>{
  if(user && userData){
    document.getElementById('menu-name').textContent = userData.name;
    document.getElementById('menu-balance').textContent = `₱${userData.balance.toFixed(2)}`;
    document.getElementById('wd-balance').textContent = `₱${userData.balance.toFixed(2)}`;
    if(userData.accountNumber) document.getElementById('menu-account').textContent = userData.accountNumber;
    if(userData.cardNumber) document.getElementById('menu-card').textContent = `•••• ${userData.cardNumber.slice(-4)}`;
    if(document.querySelector('[data-page="busy"]').classList.contains('active') ||
       document.querySelector('[data-page="auth"]').classList.contains('active')){
      showPage('menu');
    }
  } else {
    showPage('idle');
  }
});

document.getElementById('btn-logout').addEventListener('click', async ()=>{
  await cinnabank.logout();
  playCardEjectAnim();
  showPage('idle');
});

/* ============ WITHDRAW ============ */
document.querySelectorAll('.wd-amt-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.getElementById('wd-amount').value = btn.dataset.amt;
    document.querySelectorAll('.wd-amt-btn').forEach(b=> b.style.background = 'transparent');
    btn.style.background = 'rgba(61,255,160,.18)';
  });
});

document.getElementById('btn-wd-confirm').addEventListener('click', async ()=>{
  const amt = parseFloat(document.getElementById('wd-amount').value);
  const err = document.getElementById('wd-error');
  err.textContent = '';
  if(!amt || amt <= 0){ err.textContent = 'Enter a valid amount.'; return; }
  showPage('busy');
  try{
    await cinnabank.processPayment(CASHOUT_UID, amt, 'ATM Withdrawal (experience tax)');
    playDispenserAnim();
    document.getElementById('receipt-text').textContent =
      `WITHDRAWAL\n-----------------\nAmount:      -₱${amt.toFixed(2)}\nBalance:     ₱${cinnabank.userData.balance.toFixed(2)}\n\nA gust of wind sweeps your cash\noff the tray and down the street.\n\nOops! ATM Experience Tax: ₱${amt.toFixed(2)}\nThanks for visiting CinnaBank.`;
    setTimeout(()=>{ printReceiptAnim(); showPage('receipt'); }, 2500);
  }catch(e){
    err.textContent = e.message;
    showPage('withdraw');
  }
});

/* ============ LOANS ============ */
document.getElementById('btn-loan-take').addEventListener('click', async ()=>{
  const amt = parseFloat(document.getElementById('loan-amount').value);
  const err = document.getElementById('loan-error');
  err.textContent = '';
  if(!amt){ err.textContent = 'Enter an amount.'; return; }
  showPage('busy');
  try{
    const result = await cinnabank.takeLoan(amt);
    document.getElementById('receipt-text').textContent =
      `LOAN ISSUED\n-----------------\nPrincipal: ₱${amt.toFixed(2)}\nInterest:  30%\nDeadline:  10 minutes\n\n${JSON.stringify(result)}`;
    printReceiptAnim();
    showPage('receipt');
  }catch(e){
    err.textContent = e.message;
    showPage('loan');
  }
});
document.getElementById('btn-loan-pay').addEventListener('click', async ()=>{
  const amt = parseFloat(document.getElementById('loan-amount').value);
  const err = document.getElementById('loan-error');
  err.textContent = '';
  if(!amt){ err.textContent = 'Enter an amount.'; return; }
  showPage('busy');
  try{
    const result = await cinnabank.payLoan(amt);
    document.getElementById('receipt-text').textContent =
      `LOAN REPAYMENT\n-----------------\nPaid: ₱${amt.toFixed(2)}\n\n${JSON.stringify(result)}`;
    printReceiptAnim();
    showPage('receipt');
  }catch(e){
    err.textContent = e.message;
    showPage('loan');
  }
});

/* ==========================================================
   PHYSICAL ATM — built from real DOM/CSS instead of a WebGL
   scene. This guarantees the whole machine (and whole screen)
   always fits the viewport, since every dimension is derived
   from vmin (percentage of the SMALLER viewport axis).
   ========================================================== */

// build decorative keypad
const keypad = document.getElementById('keypad');
for(let i=0;i<12;i++){
  const key = document.createElement('div');
  key.className = 'key';
  keypad.appendChild(key);
}

// build cash bills (hidden until dispensed)
const billsTray = document.getElementById('bills-tray');
const bills = [];
for(let i=0;i<6;i++){
  const bill = document.createElement('div');
  bill.className = 'bill';
  billsTray.appendChild(bill);
  bills.push({
    el: bill,
    groundX: (Math.random()-.5)*70,   // vmin
    windX: 60 + Math.random()*50,     // vmin, sweep distance
    rot: (Math.random()-.5)*100,      // deg
    delay: i*70                       // ms stagger
  });
}

const dispenserFlap = document.getElementById('dispenser-flap');
const receiptPaper = document.getElementById('receipt-paper');
const cardLED = document.getElementById('card-led');

function playDispenserAnim(){
  dispenserFlap.classList.add('open');

  // bills fall onto the tray, staggered
  bills.forEach(b=>{
    setTimeout(()=>{
      b.el.style.opacity = '1';
      b.el.style.transform = `translate(${b.groundX}vmin, 5.5vmin) rotate(${b.rot}deg)`;
    }, 450 + b.delay);
  });

  // after resting, wind sweeps them off-screen
  setTimeout(()=>{
    bills.forEach(b=>{
      b.el.style.transition = 'transform .65s cubic-bezier(.3,.6,.3,1), opacity .65s ease-in';
      b.el.style.transform = `translate(${b.groundX + b.windX}vmin, 2vmin) rotate(${b.rot+180}deg)`;
      b.el.style.opacity = '0';
    });
  }, 1450);

  // flap closes, bills reset for next time
  setTimeout(()=>{
    dispenserFlap.classList.remove('open');
    bills.forEach(b=>{
      b.el.style.transition = 'none';
      b.el.style.transform = 'translate(0,-2vmin) rotate(0deg)';
    });
  }, 2300);
}

function printReceiptAnim(){
  receiptPaper.textContent = document.getElementById('receipt-text').textContent;
  receiptPaper.classList.remove('printed');
  // force reflow so the animation retriggers on repeat transactions
  void receiptPaper.offsetHeight;
  receiptPaper.classList.add('printed');
}

function playCardInsertAnim(){
  cardLED.classList.remove('led-amber');
  cardLED.classList.add('led-green');
  setTimeout(()=> cardLED.classList.remove('led-green'), 1400);
}
function playCardEjectAnim(){
  cardLED.classList.remove('led-green');
  cardLED.classList.add('led-amber');
  setTimeout(()=> cardLED.classList.remove('led-amber'), 900);
}

/* ===== subtle 3D tilt (mix of 2D panel + real CSS 3D depth) ===== */
const shell = document.getElementById('atm-shell');
const stage = document.getElementById('stage');
let targetYaw = 0, targetPitch = 0, yaw = 0, pitch = 0, dragging = false, lastX = 0, lastY = 0;

stage.addEventListener('pointerdown', e=>{ dragging = true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('pointerup', ()=> dragging = false);
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  targetYaw   += (e.clientX-lastX) * .06;
  targetPitch += (e.clientY-lastY) * .04;
  targetYaw = Math.max(-14, Math.min(14, targetYaw));
  targetPitch = Math.max(-8, Math.min(8, targetPitch));
  lastX = e.clientX; lastY = e.clientY;
});

function tiltLoop(){
  requestAnimationFrame(tiltLoop);
  yaw += (targetYaw-yaw)*.08;
  pitch += (targetPitch-pitch)*.08;
  shell.style.setProperty('--tiltY', yaw.toFixed(2)+'deg');
  shell.style.setProperty('--tiltX', (-pitch).toFixed(2)+'deg');
}
requestAnimationFrame(tiltLoop);
</script>
